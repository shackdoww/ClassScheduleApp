<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='features.css') }}"><title>Semesters</title></head><body><main class="app-shell narrow-shell"><header class="topbar"><div><div class="eyebrow">TERM MANAGEMENT</div><h1>Semesters</h1><p class="date-line">Archive old terms and keep one current schedule</p></div><a class="icon-button" href="{{ url_for('hub') }}">←</a></header><section class="feature-card"><form method="POST" class="form-grid"><div class="field field-wide"><label>Semester name</label><input name="name" placeholder="2026–2027 1st Semester" required></div><div class="field"><label>Starts</label><input type="date" name="start_date"></div><div class="field"><label>Ends</label><input type="date" name="end_date"></div><button class="primary-button" type="submit">Make current semester</button></form></section><section class="feature-card"><div class="feature-list">{% for s in semesters %}<div class="feature-row"><div class="grow"><strong>{{ s.name }}</strong><small>{{ s.start_date or 'No start' }} → {{ s.end_date or 'No end' }}</small></div>{% if s.is_current %}<span class="pill">Current</span>{% endif %}</div>{% else %}<p>No semesters yet.</p>{% endfor %}</div></section></main></body></html>
