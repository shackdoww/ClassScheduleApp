<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='features.css') }}"><title>Holidays</title></head><body><main class="app-shell narrow-shell"><header class="topbar"><div><div class="eyebrow">BREAKS</div><h1>Holidays & cancellations</h1><p class="date-line">Classes will be skipped on these dates</p></div><a class="icon-button" href="{{ url_for('home') }}">←</a></header><section class="feature-card"><form method="POST" class="form-grid"><div class="field field-wide"><label>Name</label><input name="name" placeholder="University Foundation Day" required></div><div class="field"><label>Starts</label><input type="date" name="start_date" required></div><div class="field"><label>Ends</label><input type="date" name="end_date" required></div><button class="primary-button" type="submit">Add holiday</button></form></section><section class="feature-card"><div class="feature-list">{% for h in holidays %}<div class="feature-row"><div class="grow"><strong>🌴 {{ h.name }}</strong><small>{{ h.start_date }}{% if h.end_date!=h.start_date %} → {{ h.end_date }}{% endif %}</small></div></div>{% else %}<p>No holidays configured.</p>{% endfor %}</div></section></main></body></html>
