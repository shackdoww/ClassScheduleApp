<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='features.css') }}"><title>Edit class</title></head><body><main class="app-shell narrow-shell"><header class="topbar"><div><div class="eyebrow">CLASS DETAILS</div><h1>Edit class</h1><p class="date-line">Customize the information shown in your planner and reminders.</p></div><a class="icon-button" href="{{ url_for('home') }}">←</a></header>{% if conflicts %}<div class="flash error">⚠️ This time overlaps with another class. You can still save it if the overlap is intentional.</div>{% endif %}<section class="feature-card"><form method="POST" class="form-grid"><div class="field field-wide"><label>Subject</label><input name="subject" value="{{ class_item.subject }}" required></div><div class="field"><label>Day</label><select name="day_of_week">{% for d in days %}<option value="{{ loop.index0 }}" {% if class_item.day_of_week==loop.index0 %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div><div class="field"><label>Type</label><select name="course_type"><option {% if class_item.course_type=='Class' %}selected{% endif %}>Class</option><option {% if class_item.course_type=='Exam' %}selected{% endif %}>Exam</option><option {% if class_item.course_type=='Lab' %}selected{% endif %}>Lab</option><option {% if class_item.course_type=='Other' %}selected{% endif %}>Other</option></select></div><div class="field"><label>Start</label><input type="time" name="start_time" value="{{ class_item.start_time }}" required></div><div class="field"><label>End</label><input type="time" name="end_time" value="{{ class_item.end_time }}" required></div><div class="field"><label>Room</label><input name="room" value="{{ class_item.room }}"></div><div class="field"><label>Teacher</label><input name="teacher" value="{{ class_item.teacher }}" placeholder="Optional"></div><div class="field"><label>Mode</label><select name="mode"><option {% if class_item.mode=='On campus' %}selected{% endif %}>On campus</option><option {% if class_item.mode=='Online' %}selected{% endif %}>Online</option><option {% if class_item.mode=='Hybrid' %}selected{% endif %}>Hybrid</option></select></div><div class="field"><label>Color</label><input type="color" name="color" value="{{ class_item.color or '#8b7cff' }}"></div><div class="field field-wide"><label>Meeting link</label><input name="meeting_url" value="{{ class_item.meeting_url }}" placeholder="https://... (optional)"></div><div class="field field-wide"><label>Notes</label><textarea name="notes" placeholder="Bring laptop, quiz next week...">{{ class_item.notes }}</textarea></div><button class="primary-button" type="submit">Save class <span>✓</span></button></form></section></main></body></html>
