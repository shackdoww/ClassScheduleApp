<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Class · Class Schedule</title>
</head>
<body>
<div class="app-shell narrow-shell">
    <header class="topbar reveal">
        <div><div class="eyebrow">SCHEDULE EDITOR</div><h1>Edit Class</h1><p class="date-line">Update this class entry</p></div>
        <a href="{{ url_for('home') }}" class="icon-button" aria-label="Back to dashboard">←</a>
    </header>

    <section class="page-section edit-intro reveal delay-1">
        <div class="edit-icon">✏️</div><div><div class="eyebrow">EDITING</div><h2>{{ class_item.subject }}</h2><p>Make your changes below.</p></div>
    </section>

    <section class="page-section reveal delay-2">
        <form method="POST" class="add-form">
            <div class="field field-wide"><label>Subject</label><input type="text" name="subject" value="{{ class_item.subject }}" required></div>
            <div class="field field-wide"><label>Day</label><select name="day_of_week">{% for number, day in [(0,'Monday'),(1,'Tuesday'),(2,'Wednesday'),(3,'Thursday'),(4,'Friday'),(5,'Saturday'),(6,'Sunday')] %}<option value="{{ number }}" {% if class_item.day_of_week == number %}selected{% endif %}>{{ day }}</option>{% endfor %}</select></div>
            <div class="field"><label>Start</label><input type="time" name="start_time" value="{{ class_item.start_time }}" required></div>
            <div class="field"><label>End</label><input type="time" name="end_time" value="{{ class_item.end_time }}" required></div>
            <div class="field field-wide"><label>Room</label><input type="text" name="room" value="{{ class_item.room }}" placeholder="3013A"></div>
            <button type="submit" class="primary-button">Save Changes <span>✓</span></button>
        </form>
        <a class="text-link" href="{{ url_for('home') }}">← Back to schedule</a>
    </section>
</div>
<nav class="bottom-nav"><a href="{{ url_for('home') }}" class="nav-item active"><span>▦</span><small>Schedule</small></a><a href="{{ url_for('home') }}#add" class="nav-item"><span>＋</span><small>Add</small></a><a href="{{ url_for('settings') }}" class="nav-item"><span>⚙</span><small>Settings</small></a></nav>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}"));</script>
</body>
</html>
